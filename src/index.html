<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Jose Carlos Araujo — Desarrollador de Software</title>
    <meta name="description" content="Portafolio de Jose Carlos Araujo, desarrollador de software .NET en Quito, Ecuador." />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- ?v=2 obliga al navegador a refrescar el ícono si cambia el logo -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=2" />
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2" />
    <link rel="icon" type="image/x-icon" href="favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2" />
    <meta name="theme-color" content="#0a1224" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo.
      try {
        var t = localStorage.getItem('theme');
        if (t !== 'light' && t !== 'dark') {
          t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
